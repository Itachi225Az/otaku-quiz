// Injecter les SVG dans les balises <i class="bi bi-xxx">
function replaceIcons(){
  document.querySelectorAll('i[class*="bi-"]').forEach(el=>{
    const cls=Array.from(el.classList).find(c=>c.startsWith('bi-')&&c!=='bi');
    if(!cls||!SVG[cls])return;
    const svg=document.createElement('span');
    svg.innerHTML=SVG[cls];
    const s=svg.firstChild;
    // Copier les styles de couleur et taille
    s.style.cssText='display:inline-block;vertical-align:-.125em;width:1em;height:1em;fill:currentColor';
    // Copier les classes de couleur et taille du parent <i>
    el.classList.forEach(c=>{if(c!=='bi'&&!c.startsWith('bi-'))s.classList.add(c);});
    el.replaceWith(s);
  });
}

// Attendre que le body existe avant d'observer
function startObserver(){
  if(!document.body){setTimeout(startObserver,10);return;}
  replaceIcons();
  const obs=new MutationObserver(()=>replaceIcons());
  obs.observe(document.body,{childList:true,subtree:true});
}
// Démarrer dès que possible
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',startObserver);
} else {
  startObserver();
}
})();

function ls(k,v){

}

async function sha256(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}

function fbInit(){
  try{

    FB=false;
  }

function fbSet(col,id,data){
  if(!db)return;
  db.collection(col).doc(id).set({...data,_ts:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).catch(()=>{});
}

function fbListen(col,cb,filters=[]){
  if(!db)return()=>{};
  let ref=db.collection(col).orderBy('_ts','desc').limit(300);
  filters.forEach(([f,op,v])=>ref=ref.where(f,op,v));
  return ref.onSnapshot(snap=>{
    const docs=[];
    snap.forEach(d=>docs.push({id:d.id,...d.data()}));
    cb(docs);
  },e=>console.warn('listen:',e));
}

function fbStartSync(){
  _unsubs.forEach(u=>{try{u();}catch{}});
  _unsubs=[];
  if(!db)return;
  // Sync ventes
  _unsubs.push(fbListen('kairos_ventes',docs=>{
    const map={};
    (ls('ventes')||[]).forEach(v=>map[v.id]=v);
    docs.forEach(d=>{if(d.id&&d.date)map[d.id]=d;});
    S.ventes=Object.values(map).sort((a,b)=>(b.ts||0)-(a.ts||0));

      ls('stock',S.stock);
    },[]));
  }
}

async function authLogin(nom,pwd,role){
  const users=await getUsers();
  const h=await sha256(pwd);
  // For admin: match by nom + email or just nom
  const u=users.find(x=>{
    if(x.role!==role)return false;
    if(x.pwd!==h)return false;
    return x.nom.toLowerCase()===nom.toLowerCase();
  });
  return u||null;
}

async function authRegister(nom,prenom,role,pwd,email,createdBy){
  const users=await getUsers();
  if(users.find(u=>u.nom.toLowerCase()===nom.toLowerCase()&&u.role===role)){
    return{err:'Ce nom existe déjà pour ce rôle'};
  }
  const h=await sha256(pwd);
  const newUser={id:gid(),nom,prenom:prenom||'',role,pwd:h,email:email||'',createdBy:createdBy||'',creeLe:todayStr()};
  users.push(newUser);
  ls('users',users);
  // Sync to Firebase
  fbSet('kairos_users',newUser.id,{nom,prenom,role,email,createdBy,creeLe:todayStr()});
  return{ok:true,user:newUser};
}

async function authChangePwd(userId,oldPwd,newPwd){
  const users=await getUsers();
  const h=await sha256(oldPwd);
  const idx=users.findIndex(u=>u.id===userId&&u.pwd===h);
  if(idx<0)return false;
  users[idx].pwd=await sha256(newPwd);
  ls('users',users);
  return true;
}

async function adminChangePwd(userId,newPwd){

}

function recordVente(items,lieu,mode,credit,source){
  items.forEach(it=>{
    const v={
      id:gid(),date:todayStr(),heure:timeStr(),ts:Date.now(),
      caissier:S.user.nom,userId:S.user.id,
      produit:it.nom,produitId:it.id||it.produitId,
      categorie:it.cat||'boisson',lieu,
      montant:it.prix,mode:credit?'credit':mode,
      credit:!!credit,source:source||'direct',
      groupeId:it.groupeId||null,clientId:it.clientId||null
    };
    S.ventes.unshift(v);
    fbSet('kairos_ventes',v.id,v);
    deductStock(v.produitId,1);
  });
  save();
}

function getTotaux(){
  const v=S.ventes.filter(x=>x.date===todayStr());
  let cave={bCash:0,bWave:0,nCash:0,nWave:0};
  let bar={bCash:0,bWave:0};
  let cred=0,cash=0,wave=0;
  v.forEach(vt=>{
    if(vt.credit){cred+=vt.montant;return;}
    const isBar=vt.lieu==='bar';
    const isN=vt.categorie==='nourriture';
    const isCash=vt.mode==='cash';
    if(!isBar){if(isN){if(isCash)cave.nCash+=vt.montant;else cave.nWave+=vt.montant;}else{if(isCash)cave.bCash+=vt.montant;else cave.bWave+=vt.montant;}}
    else{if(isCash)bar.bCash+=vt.montant;else bar.bWave+=vt.montant;}
    if(isCash)cash+=vt.montant;else wave+=vt.montant;
  });
  const total=cash+wave;
  const ssCave=cave.bCash+cave.bWave+cave.nCash+cave.nWave;
  const ssBar=bar.bCash+bar.bWave;
  return{cave,bar,cred,cash,wave,total,ssCave,ssBar};
}

function getStk(id){return S.stock[id]||{init:0,entrees:0,sorties:0,mvts:[]};}
function stkRestant(id){const s=getStk(id);return Math.max(0,(s.init||0)+(s.entrees||0)-(s.sorties||0));}
function stkAlert(id){const r=stkRestant(id);if(r===0)return'out';if(r<=3)return'low';return'ok';}

function addStockEntry(prodId,qte,note){
  if(!S.stock[prodId])S.stock[prodId]={init:0,entrees:0,sorties:0,mvts:[]};
  S.stock[prodId].entrees=(S.stock[prodId].entrees||0)+qte;
  if(!S.stock[prodId].mvts)S.stock[prodId].mvts=[];
  S.stock[prodId].mvts.unshift({type:'entree',qte,date:todayStr(),heure:timeStr(),user:S.user?.nom,note:note||''});
  save();
  fbSet('kairos_stock',prodId,{produit:prodId,...S.stock[prodId],dateMaj:todayStr()});

function deductStock(prodId,qte){
  if(!prodId)return;
  if(!S.stock[prodId])S.stock[prodId]={init:0,entrees:0,sorties:0,mvts:[]};
  S.stock[prodId].sorties=(S.stock[prodId].sorties||0)+qte;

function renderGroupes(){
  return`<div class="p-3">
    <button class="btn-primary mb-4" onclick="W.addGroupe()"><i class="bi bi-people-fill me-2"></i>Créer un groupe</button>
    ${!S.groupes.length?`<div class="text-center text-gray-600 py-10"><i class="bi bi-people-fill text-4xl block mb-2"></i>Aucun groupe</div>`:

function renderCave(){
  const cats=[...new Set(CAVE.nourriture.map(p=>p.cat))];

    <button class="prod-btn" onclick="W.venteRapide('${p.id}','${lieu}')">
      <i class="bi ${p.icon||'bi-cup'} text-orange-400 text-xl"></i>

      lastSales.map(v=>`<div class="flex justify-between items-center py-2 border-b border-gray-800 last:border-0">

function showOverlay(html){
  closePanel();
  const d=document.createElement('div');
  d.id='panelRoot';
  d.innerHTML=html;
  document.body.appendChild(d);
}
function closePanel(){const p=document.getElementById('panelRoot');if(p)p.remove();S._gSel={};}

function showModal(html){
  closeModal();
  const d=document.createElement('div');
  d.id='modalRoot';
  d.className='modal-center';
  d.innerHTML=`<div class="modal-box">${html}</div>`;
  d.addEventListener('click',e=>{if(e.target===d)closeModal();});
  document.body.appendChild(d);
}
function closeModal(){const m=document.getElementById('modalRoot');if(m)m.remove();}

  // Super Admin secret tap
  saClick(){
    S._saClicks=(S._saClicks||0)+1;

      for(let i=0;i<5;i++){const d=$('sd'+i);if(d)d.className='sa-dot'+(i<S._saClicks?' lit':'');}
    }
    if(S._saClicks>=5){S._saClicks=0;S._loginRole='superadmin';S.screen='login';render();}
    setTimeout(()=>{if(S._saClicks>0&&S._saClicks<5){S._saClicks=0;const d=$('saDots');if(d)d.style.display='none';[0,1,2,3,4].forEach(i=>{const e=$('sd'+i);if(e)e.className='sa-dot';});}},3000);
  },

  async doLogin(){
    const nom=($('ln')?.value||'').trim();
    const pwd=$('lpwd')?.value||'';
    const role=S._loginRole||'caissier';
    if(!nom||!pwd){S._loginErr='Nom et mot de passe requis';render();return;}
    const btn=$('loginBtn');if(btn)btn.disabled=true;
    // Super Admin
    if(role==='superadmin'){
      const code=$('lcode')?.value||'';
      if(nom==='SuperAdmin'&&pwd==='KAIROS#2024'&&code===SA_CODE){
        S.user={id:'sa',nom:'SuperAdmin',role:'superadmin'};
        S.role='superadmin';S.screen='superadmin';S.adminTab='dashboard';
        logAction('Connexion Super Admin');fbStartSync();render();return;
      }
      S._loginErr='Identifiants Super Admin incorrects';if(btn)btn.disabled=false;render();return;
    }
    const u=await authLogin(nom,pwd,role);
    if(!u){S._loginErr='Nom ou mot de passe incorrect';if(btn)btn.disabled=false;render();return;}
    S.user=u;S.role=u.role;S._loginErr=null;
    if(role==='caissier'){
      S.screen='caissier';S.tab='clients';
      openSession();
      const sessions=ls('sessions')||[];
      sessions.unshift({id:gid(),caissier:u.nom,date:todayStr(),ouverture:timeStr(),userId:u.id});
      ls('sessions',sessions.slice(0,20));

      S.screen='admin';S.adminTab='dashboard';
      logAction('Connexion admin');

    fbStartSync();render();

    showModal(`<div class="text-blue-400 font-bold mb-2 flex items-center gap-2"><i class="bi bi-key-fill"></i>Nouveau MDP pour ${u.nom}</div>
      <div class="flex flex-col gap-3 mb-4">
        <div class="relative"><input id="arp_new" class="inp" type="password" placeholder="Nouveau mot de passe" style="padding-right:48px"><button class="eye-btn" onclick="W.togglePwd('arp_new','arpe1')" id="arpe1"><i class="bi bi-eye"></i></button></div>
        <div class="relative"><input id="arp_conf" class="inp" type="password" placeholder="Confirmer" style="padding-right:48px"><button class="eye-btn" onclick="W.togglePwd('arp_conf','arpe2')" id="arpe2"><i class="bi bi-eye"></i></button></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <button class="btn-secondary" onclick="closeModal()">Annuler</button>
        <button class="btn-primary" onclick="W._confirmAdminReset('${uid}')"><i class="bi bi-check2 me-1"></i>Modifier</button>
      </div>`);
  },
  async _confirmAdminReset(uid){
    const n=$('arp_new')?.value||'';const c=$('arp_conf')?.value||'';
    if(n.length<4){toast('Min 4 caractères','err');return;}
    if(n!==c){toast('Mots de passe différents','err');return;}
    await adminChangePwd(uid,n);closeModal();toast('✅ Mot de passe modifié!','ok');
  },
  adminDelUser(uid){
    if(uid===S.user?.id){toast('Impossible de supprimer votre propre compte','err');return;}
    const users=ls('users')||[];const u=users.find(x=>x.id===uid);
    showModal(`<div class="text-red-400 font-bold mb-3">Supprimer ${u?.nom}?</div>
      <div class="grid grid-cols-2 gap-3">
        <button class="btn-secondary" onclick="closeModal()">Annuler</button>
        <button class="btn-red" onclick="W._confirmDelUser('${uid}')">Supprimer</button>
      </div>`);
  },
  _confirmDelUser(uid){const users=ls('users')||[];ls('users',users.filter(x=>x.id!==uid));closeModal();toast('✅ Compte supprimé');render();},

  // CREATE ACCOUNT
  showCreateAccount(){
    // SÉCURITÉ : Seul Admin/SuperAdmin peut créer des comptes
    // Un visiteur non connecté ne peut créer QUE des comptes caissier
    // Seul Admin/SuperAdmin peut créer des admins
    const canCreateAdmin = S.role==='admin' || S.role==='superadmin';
    const isConnected = !!S.user;

    showModal(`
      <div class="text-orange-500 font-bold text-base mb-1 flex items-center gap-2">
        <i class="bi bi-person-plus-fill"></i>Créer un compte
      </div>
      <div class="text-gray-500 text-xs mb-4">
        ${canCreateAdmin ? 'Vous pouvez créer des caissiers et des admins.' : '⚠️ Création de compte caissier uniquement.'}
      </div>
      <div class="flex flex-col gap-3 mb-4">
        <div>
          <label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5 block">Nom</label>
          <input id="cr_nom" class="inp" placeholder="Nom complet" autocomplete="off">
        </div>
        <div>
          <label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5 block">Prénom</label>
          <input id="cr_prenom" class="inp" placeholder="Prénom" autocomplete="off">
        </div>
        <div>
          <label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5 block">Mot de passe</label>
          <div class="relative">
            <input id="cr_pwd" class="inp" type="password" placeholder="Min 4 caractères" style="padding-right:48px">
            <button class="eye-btn" onclick="W.togglePwd('cr_pwd','cre1')" id="cre1"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div>
          <label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5 block">Confirmer</label>
          <div class="relative">
            <input id="cr_conf" class="inp" type="password" placeholder="Confirmer" style="padding-right:48px">
            <button class="eye-btn" onclick="W.togglePwd('cr_conf','cre2')" id="cre2"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div>
          <label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 block">Type de compte</label>
          <div class="grid grid-cols-2 gap-2">
            <button id="cr_r_c" onclick="W._setCrRole('caissier')" style="padding:13px;border-radius:12px;font-weight:800;font-size:.88rem;cursor:pointer;border:2px solid #f97316;background:#431407;color:#f97316;font-family:inherit">
              <i class="bi bi-person-fill me-1"></i>Caissier
            </button>
            <button id="cr_r_a" onclick="W._setCrRole('admin')"
              style="padding:13px;border-radius:12px;font-weight:800;font-size:.88rem;border:2px solid #2a2a38;background:#1a1a24;color:#6b7280;font-family:inherit;${canCreateAdmin?'cursor:pointer':'cursor:not-allowed;opacity:.35;pointer-events:none'}"
              ${canCreateAdmin?'':'disabled title="Réservé aux admins connectés"'}>
              <i class="bi bi-shield-fill me-1"></i>Admin
            </button>
          </div>
          ${!canCreateAdmin?`<div class="mt-2 p-2 rounded-lg text-xs text-yellow-500 flex items-center gap-1" style="background:rgba(234,179,8,.08);border:1px solid rgba(234,179,8,.2)"><i class="bi bi-lock-fill"></i> Seul un Admin connecté peut créer un compte Admin</div>`:''}
        </div>
      </div>
      <div id="crErr" class="hidden mb-3 p-3 rounded-xl text-red-400 text-sm" style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3)"></div>
      <div class="grid grid-cols-2 gap-3">
        <button class="btn-secondary" onclick="closeModal()">Annuler</button>
        <button class="btn-primary" onclick="W.validerCreateAccount()"><i class="bi bi-check2 me-1"></i>Créer</button>
      </div>
    `);
    W._crRole='caissier';
  },
  _crRole:'caissier',
  _setCrRole(r){
    W._crRole=r;
    const bc=$('cr_r_c'),ba=$('cr_r_a');
    if(bc){bc.style.borderColor=r==='caissier'?'#f97316':'#2a2a38';bc.style.background=r==='caissier'?'#431407':'#1a1a24';bc.style.color=r==='caissier'?'#f97316':'#6b7280';}
    if(ba){ba.style.borderColor=r==='admin'?'#3b82f6':'#2a2a38';ba.style.background=r==='admin'?'#1e3a5f':'#1a1a24';ba.style.color=r==='admin'?'#3b82f6':'#6b7280';}
  },
  async validerCreateAccount(){
    const nom=($('cr_nom')?.value||'').trim();
    const prenom=($('cr_prenom')?.value||'').trim();
    const email=$('cr_email')?.value||'';
    const pwd=$('cr_pwd')?.value||'';
    const conf=$('cr_conf')?.value||'';
    const role=W._crRole||'caissier';
    const errEl=$('crErr');
    const showErr=(msg)=>{if(errEl){errEl.textContent='❌ '+msg;errEl.classList.remove('hidden');}};

    // ══ VÉRIFICATION SÉCURITÉ ══
    // Personne ne peut créer un compte Admin sans être Admin/SuperAdmin connecté
    if(role==='admin' && S.role!=='admin' && S.role!=='superadmin'){
      showErr('Accès refusé — Seul un administrateur connecté peut créer un compte admin');
      return;
    }
    // Personne ne peut créer un SuperAdmin depuis l'interface
    if(role==='superadmin'){
      showErr('Accès refusé — Le Super Admin ne peut pas être créé depuis cette interface');
      return;
    }
    // ══════════════════════════

    if(!nom){showErr('Le nom est requis');return;}
    if(pwd.length<4){showErr('Mot de passe trop court (min 4 caractères)');return;}
    if(pwd!==conf){showErr('Les mots de passe ne correspondent pas');return;}
    const res=await authRegister(nom,prenom,role,pwd,email,S.user?.nom||'public');
    if(res.err){showErr(res.err);return;}
    closeModal();
    toast(`✅ Compte "${nom}" (${role}) créé!`,'ok');
    if(S.screen==='admin'||S.screen==='superadmin')render();
  },

  // EXPORT
  exportJSON(){
    const data={ventes:S.ventes,clients:S.clients,groupes:S.groupes,journal:S.journal,stock:S.stock,session:S.session,export:now().toISOString()};
    const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kairos_'+todayStr()+'.json';a.click();
    toast('✅ Export JSON téléchargé','ok');
  },
};

window.W=W;window.S=S;window.closeModal=closeModal;window.closePanel=closePanel;

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
async function init(){
  // Initialiser Firebase (avec gestion d'erreur silencieuse si hors ligne)
  try {
    fbInit();
  } catch(e) {
    console.warn('Firebase non disponible, mode local activé:', e.message);
    FB = false;
  }
  await createDefaultUsers();
  load();
  S.screen='profil';
  render();
}

// Attendre que tout le DOM ET les scripts externes (Firebase) soient chargés
window.addEventListener('load', init);

})();
</script>
</body>
</html>
